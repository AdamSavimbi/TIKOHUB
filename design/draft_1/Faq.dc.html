<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Questions and trust</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#0b0b0b;background:#ffffff}
a{color:#0b0b0b}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 780px; box-sizing: border-box; padding: 36px 16px 28px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden">

<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: #6b6b66">HELP</div>
<h2 style="margin: 12px 0 0; font-size: 44px; font-weight: 500; line-height: 0.98; letter-spacing: -0.045em">Good to know.</h2>

<div style="margin-top: 26px; display: flex; flex-direction: column">
<sc-for list="{{ items }}" as="q" hint-placeholder-count="5">
<div style="border-top: 1px solid #e4e4e0">
<button type="button" aria-expanded="{{ q.expanded }}" onClick="{{ q.toggle }}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 64px; padding: 12px 0; border: 0; background: transparent; color: #0b0b0b; text-align: left; font-family: inherit; font-size: 19px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; cursor: pointer">
<span>{{ q.question }}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; transform: rotate({{ q.rot }}deg); transition: transform 0.25s ease"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
<div style="padding: 0 36px 18px 0; font-size: 16px; line-height: 1.5; color: #6b6b66">{{ q.answer }}</div>
</sc-if>
</div>
</sc-for>
<div style="border-top: 1px solid #e4e4e0"></div>
</div>

<div style="margin-top: auto; font-size: 15px; line-height: 1.5; color: #6b6b66">Still stuck? <a href="#" style="font-weight: 600">Contact us</a></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const open = st.open === undefined ? 0 : st.open;
    const base = [
      { question: 'Do I need to download an app?', answer: 'No. Your ticket opens in your browser, and we also send you a link by SMS and email.' },
      { question: 'What will I pay?', answer: 'The full price is shown before you pay: the ticket plus a service fee, and nothing else. [Service fee amount to be confirmed]' },
      { question: 'I lost my ticket. What now?', answer: 'Open the SMS or email link we sent you, or go to My tickets and enter your phone number.' },
      { question: 'Can I get a refund?', answer: '[Refund policy to be confirmed with the client]' },
      { question: 'Is my payment safe?', answer: 'You approve every payment on your own phone with your M-Pesa PIN. We never see your PIN. [Payment provider wording to be confirmed]' }
    ];
    const items = base.map((q, i) => {
      const isOpen = i === open;
      return {
        id: 'q' + i, question: q.question, answer: q.answer,
        open: isOpen,
        expanded: isOpen ? 'true' : 'false',
        rot: isOpen ? 45 : 0,
        toggle: () => this.setState({ open: isOpen ? -1 : i })
      };
    });
    return { items: items };
  }
}
</script>
</body>
</html>
