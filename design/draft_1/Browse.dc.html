<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse events</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#0b0b0b;background:#ffffff}
a{color:inherit;text-decoration:none}
.chiprow{scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 860px; box-sizing: border-box; padding: 36px 16px 28px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden">

<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: #6b6b66">BROWSE</div>
<h2 style="margin: 12px 0 0; font-size: 44px; font-weight: 500; line-height: 0.98; letter-spacing: -0.045em">This weekend.</h2>

<div class="chiprow" style="margin: 20px -16px 0; padding: 0 16px; display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{ c.pick }}" style="flex: none; height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap">{{ c.label }}</button>
</sc-for>
</div>

<div style="margin-top: 18px; min-height: 536px; display: flex; flex-direction: column">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
<a href="#" style="display: flex; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid #e4e4e0">
<span aria-hidden="true" style="flex: none; width: 72px; height: 88px; border-radius: 14px; overflow: hidden; position: relative; background: {{ r.bg }}">
<span style="position: absolute; left: 4px; bottom: 6px; font-size: 30px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.8; color: rgba(255,255,255,0.28)">{{ r.art }}</span>
</span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #6b6b66">{{ r.when }}</span>
<span style="font-size: 19px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15">{{ r.title }}</span>
<span style="font-size: 14px; color: #6b6b66">{{ r.venue }}</span>
<span style="font-size: 14px; font-weight: 600">{{ r.priceLine }}</span>
</span>
</a>
</sc-for>
</div>

<div style="margin-top: auto">
<button type="button" style="height: 52px; padding: 0 28px; border: 0; border-radius: 26px; background: #f2f2f0; color: #0b0b0b; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">View all events</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const chip = st.chip || 'all';
    const events = [
      { when: 'FRI 31 OCT · 7 PM', title: 'Rooftop Sessions', venue: 'Westlands, Nairobi', priceLine: 'from KES 1,500 · 412 left', art: 'ROOF', tags: ['night'], bg: 'linear-gradient(160deg,#2b2f3a 0%,#7d5f4b 100%)' },
      { when: 'SAT 1 NOV · 5 PM', title: 'Savannah Night Market', venue: 'Karen, Nairobi', priceLine: 'from KES 500 · 1,200 left', art: 'NIGHT', tags: ['under', 'night'], bg: 'linear-gradient(160deg,#1f3a2e 0%,#8a6b2f 100%)' },
      { when: 'SAT 1 NOV · 8 PM', title: 'Jazz at the Gardens', venue: 'Lavington, Nairobi', priceLine: 'from KES 2,000 · 40 VIP left', art: 'JAZZ', tags: ['music'], bg: 'linear-gradient(160deg,#2a2240 0%,#8a4f68 100%)' },
      { when: 'SUN 2 NOV · 7 AM', title: 'Sunday Run Club Social', venue: 'Kilimani, Nairobi', priceLine: 'Free entry', art: 'RUN', tags: ['free', 'under'], bg: 'linear-gradient(160deg,#16323f 0%,#3f7f86 100%)' },
      { when: 'FRI 7 NOV · 8 PM', title: 'Comedy Cellar Nairobi', venue: 'Westlands, Nairobi', priceLine: 'from KES 1,200 · 120 left', art: 'LIVE', tags: ['night'], bg: 'linear-gradient(160deg,#3a1f1f 0%,#a8523a 100%)' },
      { when: 'SAT 8 NOV · 10 AM', title: 'Kilimani Art Walk', venue: 'Kilimani, Nairobi', priceLine: 'from KES 800 · 85 left', art: 'ART', tags: ['under'], bg: 'linear-gradient(160deg,#2c2c2c 0%,#6b6b66 100%)' }
    ];
    const chipDefs = [
      { key: 'all', label: 'All' },
      { key: 'free', label: 'Free' },
      { key: 'under', label: 'Under 1,000' },
      { key: 'music', label: 'Live Music' },
      { key: 'night', label: 'Nightlife' }
    ];
    const chips = chipDefs.map((c) => {
      const on = c.key === chip;
      return {
        key: c.key, label: c.label,
        bg: on ? '#0b0b0b' : '#ffffff',
        fg: on ? '#ffffff' : '#0b0b0b',
        border: on ? '#0b0b0b' : '#cfccc5',
        pick: () => this.setState({ chip: c.key })
      };
    });
    const rows = events
      .filter((e) => chip === 'all' || e.tags.indexOf(chip) !== -1)
      .map((e, i) => ({ id: 'r' + i, when: e.when, title: e.title, venue: e.venue, priceLine: e.priceLine, art: e.art, bg: e.bg }));
    return { chips: chips, rows: rows };
  }
}
</script>
</body>
</html>
